[project]
name = "kwon-decision"
version = "0.1.0"
description = "선택 장애 해결! 여러 선택지 중 하나를 골라주는 MCP 서버"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "fastmcp>=2.0.0",
    "uvicorn>=0.30.0",
    "starlette>=0.38.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = ["mcp_server.py"]
